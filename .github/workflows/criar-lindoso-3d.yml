name: Criar Lindoso 3D

# Cole este arquivo em .github/workflows/criar-lindoso-3d.yml no repositório Lindoso-3D.
# Ele escreve todos os arquivos do jogo (Godot 4 + GDScript) e faz o commit sozinho.
# Roda automaticamente no primeiro commit e também manualmente (aba Actions > Run workflow).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/criar-lindoso-3d.yml'

permissions:
  contents: write

jobs:
  criar:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.run_number == 1
    steps:
      - uses: actions/checkout@v4

      - name: Escrever arquivos do projeto
        run: |
          mkdir -p scenes scripts assets models
          cat > .gitignore << 'EOF_LINDOSO'
          .godot/
          *.apk
          *.aab
          *.idsig
          export_presets.cfg
          .import/
          EOF_LINDOSO
          cat > README.md << 'EOF_LINDOSO'
          # Lindoso 3D

          Jogo 3D estilo Ludo feito em **Godot 4.x** com **GDScript**.

          ## Regras
          - Tabuleiro 3D em cruz com 52 casas, 4 cores (Vermelho, Verde, Amarelo, Azul), 4 peões cada.
          - Modo **1 jogador vs 3 bots** ou **2 a 4 jogadores locais** (celular passado entre os jogadores).
          - É preciso tirar **6** para sair da base. Tirar **6** joga de novo.
          - Cair numa casa com peão inimigo manda ele de volta para a base (casas douradas são seguras).
          - Para entrar no centro é preciso o número exato. Vence quem levar os 4 peões ao centro.

          ## Estrutura
          - `scenes/main.tscn` – cena principal (só o `game_manager.gd`; o resto é montado por código)
          - `scripts/game_manager.gd` – regras, turnos, vitória, tabuleiro e UI
          - `scripts/player.gd` – peões e movimento
          - `scripts/dice.gd` – dado 3D animado
          - `scripts/bot.gd` – IA dos bots
          - `assets/`, `models/` – reservadas para modelos .glb e texturas futuras

          ## Rodar
          Abra a pasta no Godot 4.3+ e aperte F5. Para Android: Projeto > Exportar > Android
          (configure o JDK e o Android SDK em Editor > Configurações do Editor > Exportar).
          Tela vertical (720x1280), câmera a 45 graus, botões grandes para toque.
          EOF_LINDOSO
          cat > assets/icon.svg << 'EOF_LINDOSO'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><rect width="128" height="128" rx="24" fill="#4aa3ff"/><rect x="24" y="24" width="80" height="80" rx="14" fill="#fff"/><circle cx="46" cy="46" r="9" fill="#e53935"/><circle cx="82" cy="46" r="9" fill="#43a047"/><circle cx="64" cy="64" r="9" fill="#fdd835"/><circle cx="46" cy="82" r="9" fill="#1e88e5"/><circle cx="82" cy="82" r="9" fill="#e53935"/></svg>
          EOF_LINDOSO
          touch models/.gitkeep
          cat > project.godot << 'EOF_LINDOSO'
          config_version=5

          [application]

          config/name="Lindoso 3D"
          run/main_scene="res://scenes/main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          config/icon="res://assets/icon.svg"

          [display]

          window/size/viewport_width=720
          window/size/viewport_height=1280
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"
          window/handheld/orientation=1

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF_LINDOSO
          cat > scenes/main.tscn << 'EOF_LINDOSO'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/game_manager.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF_LINDOSO
          cat > scripts/bot.gd << 'EOF_LINDOSO'
          class_name LudoBot
          extends RefCounted
          ## IA simples: pontua cada jogada possível e escolhe a melhor.
          ## Prioridade: chegar ao centro > comer peão > sair da base > fugir de perigo > casa segura.


          static func choose(player: LudoPlayer, dice: int, players: Array) -> int:
          	var best := -1
          	var best_score := -INF
          	for i in player.movable_pawns(dice):
          		var s := _score(player, i, dice, players) + randf() * 0.5
          		if s > best_score:
          			best_score = s
          			best = i
          	return best


          static func _score(player: LudoPlayer, i: int, dice: int, players: Array) -> float:
          	var r: int = player.rel[i]
          	var nr: int = 0 if r == LudoPlayer.BASE_REL else r + dice
          	var score := 0.0

          	if nr == LudoPlayer.FINISH_REL:
          		score += 100.0
          	if r == LudoPlayer.BASE_REL:
          		score += 60.0

          	if nr <= 50:
          		var cell: int = (LudoPlayer.START_INDEX[player.seat] + nr) % 52
          		var safe: bool = cell in LudoPlayer.SAFE_CELLS
          		if safe:
          			score += 15.0
          		else:
          			for other in players:
          				if other == player:
          					continue
          				for j in 4:
          					if other.abs_index(j) == cell:
          						score += 80.0 + float(other.rel[j])
          			if _threatened(player, cell, players):
          				score -= 25.0
          	else:
          		score += 25.0  # reta final é segura

          	if r >= 0 and r <= 50:
          		var cur: int = (LudoPlayer.START_INDEX[player.seat] + r) % 52
          		if not (cur in LudoPlayer.SAFE_CELLS) and _threatened(player, cur, players):
          			score += 30.0  # fugir de uma casa ameaçada

          	score += float(nr) * 0.5
          	return score


          ## Há peão inimigo de 1 a 6 casas atrás desta casa?
          static func _threatened(player: LudoPlayer, cell: int, players: Array) -> bool:
          	for other in players:
          		if other == player:
          			continue
          		for j in 4:
          			var a: int = other.abs_index(j)
          			if a < 0:
          				continue
          			var dist := (cell - a + 52) % 52
          			if dist >= 1 and dist <= 6:
          				return true
          	return false
          EOF_LINDOSO
          cat > scripts/dice.gd << 'EOF_LINDOSO'
          class_name Dice3D
          extends Node3D
          ## Dado 3D com animação. Faces opostas somam 7.

          const SIZE = 1.2
          # [valor, normal da face, rotação do texto em graus]
          const FACES = [
          	[1, Vector3(0, 1, 0), Vector3(-90, 0, 0)],
          	[6, Vector3(0, -1, 0), Vector3(90, 0, 0)],
          	[3, Vector3(1, 0, 0), Vector3(0, 90, 0)],
          	[4, Vector3(-1, 0, 0), Vector3(0, -90, 0)],
          	[2, Vector3(0, 0, 1), Vector3(0, 0, 0)],
          	[5, Vector3(0, 0, -1), Vector3(0, 180, 0)],
          ]

          var value := 1
          var _cube: MeshInstance3D
          var _mat: StandardMaterial3D


          func _ready() -> void:
          	_cube = MeshInstance3D.new()
          	var box := BoxMesh.new()
          	box.size = Vector3.ONE * SIZE
          	_cube.mesh = box
          	_mat = StandardMaterial3D.new()
          	_mat.albedo_color = Color.WHITE
          	_mat.roughness = 0.3
          	_cube.material_override = _mat
          	add_child(_cube)
          	for f in FACES:
          		var lbl := Label3D.new()
          		lbl.text = str(f[0])
          		lbl.font_size = 100
          		lbl.pixel_size = 0.008
          		lbl.modulate = Color(0.1, 0.1, 0.25)
          		lbl.position = (f[1] as Vector3) * (SIZE / 2.0 + 0.01)
          		lbl.rotation_degrees = f[2]
          		_cube.add_child(lbl)


          func set_tint(c: Color) -> void:
          	_mat.albedo_color = Color.WHITE.lerp(c, 0.35)


          ## Rola o dado e devolve o valor (1-6) ao fim da animação.
          func roll() -> int:
          	value = randi_range(1, 6)
          	var start_q := Quaternion(_cube.basis.orthonormalized())
          	var final_q := Quaternion(_face_basis(value))
          	var axis := Vector3(randf() - 0.5, randf() - 0.5, randf() - 0.5)
          	if axis.length() < 0.01:
          		axis = Vector3.UP
          	axis = axis.normalized()

          	var spin := create_tween()
          	spin.tween_method(_spin_step.bind(start_q, final_q, axis), 0.0, 1.0, 1.0) \
          		.set_trans(Tween.TRANS_QUAD).set_ease(Tween.EASE_OUT)

          	var bounce := create_tween()
          	bounce.tween_property(_cube, "position:y", 1.8, 0.4).set_trans(Tween.TRANS_QUAD).set_ease(Tween.EASE_OUT)
          	bounce.tween_property(_cube, "position:y", 0.0, 0.35).set_trans(Tween.TRANS_QUAD).set_ease(Tween.EASE_IN)
          	bounce.tween_property(_cube, "position:y", 0.5, 0.12).set_trans(Tween.TRANS_QUAD).set_ease(Tween.EASE_OUT)
          	bounce.tween_property(_cube, "position:y", 0.0, 0.13).set_trans(Tween.TRANS_QUAD).set_ease(Tween.EASE_IN)

          	await spin.finished
          	return value


          func _spin_step(t: float, start_q: Quaternion, final_q: Quaternion, axis: Vector3) -> void:
          	var extra := Quaternion(axis, TAU * 3.0 * t)  # 3 voltas; em t=1 vira identidade
          	_cube.basis = Basis(extra * start_q.slerp(final_q, t))


          func _face_basis(v: int) -> Basis:
          	match v:
          		6: return Basis(Vector3.RIGHT, PI)
          		3: return Basis(Vector3.BACK, PI / 2.0)
          		4: return Basis(Vector3.BACK, -PI / 2.0)
          		2: return Basis(Vector3.RIGHT, -PI / 2.0)
          		5: return Basis(Vector3.RIGHT, PI / 2.0)
          	return Basis()
          EOF_LINDOSO
          cat > scripts/game_manager.gd << 'EOF_LINDOSO'
          extends Node3D
          ## Lindoso 3D - regras, turnos, vitória, tabuleiro e interface.
          ## Regras: 6 para sair da base | 6 joga de novo | comer manda o peão à base
          ## (exceto em casas seguras, marcadas em dourado) | vence quem levar os 4 peões ao centro.

          enum State { MENU, WAIT_ROLL, WAIT_PICK, BUSY, GAME_OVER }

          var state: State = State.MENU
          var players: Array[LudoPlayer] = []
          var current := 0
          var dice_value := 0
          var movable: Array[int] = []
          var _game_id := 0

          var camera: Camera3D
          var dice: Dice3D
          var turn_label: Label
          var msg_label: Label
          var roll_button: Button
          var pick_box: HBoxContainer
          var pick_buttons: Array[Button] = []
          var menu_panel: Control
          var win_panel: Control
          var win_label: Label


          func _ready() -> void:
          	randomize()
          	_build_environment()
          	_build_board()
          	_build_ui()
          	_show_menu()


          # ---------------------------------------------------------------- cena 3D

          func _build_environment() -> void:
          	var env := Environment.new()
          	env.background_mode = Environment.BG_COLOR
          	env.background_color = Color(0.53, 0.81, 0.98)
          	env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
          	env.ambient_light_color = Color.WHITE
          	env.ambient_light_energy = 0.6
          	var we := WorldEnvironment.new()
          	we.environment = env
          	add_child(we)

          	var sun := DirectionalLight3D.new()
          	sun.rotation_degrees = Vector3(-55, 25, 0)
          	sun.shadow_enabled = true
          	add_child(sun)

          	# Câmera a 45 graus; KEEP_WIDTH garante o tabuleiro inteiro em tela vertical
          	camera = Camera3D.new()
          	camera.keep_aspect = Camera3D.KEEP_WIDTH
          	camera.fov = 58.0
          	add_child(camera)
          	camera.position = Vector3(0, 12, 12)
          	camera.look_at(Vector3.ZERO)
          	camera.make_current()

          	dice = Dice3D.new()
          	dice.position = Vector3(0, 0.9, 10)
          	add_child(dice)


          func _mat(col: Color) -> StandardMaterial3D:
          	var m := StandardMaterial3D.new()
          	m.albedo_color = col
          	m.roughness = 0.6
          	return m


          func _box(size: Vector3, pos: Vector3, col: Color) -> MeshInstance3D:
          	var mi := MeshInstance3D.new()
          	var b := BoxMesh.new()
          	b.size = size
          	mi.mesh = b
          	mi.material_override = _mat(col)
          	mi.position = pos
          	add_child(mi)
          	return mi


          func _disc(radius: float, height: float, pos: Vector3, col: Color) -> void:
          	var mi := MeshInstance3D.new()
          	var c := CylinderMesh.new()
          	c.top_radius = radius
          	c.bottom_radius = radius
          	c.height = height
          	mi.mesh = c
          	mi.material_override = _mat(col)
          	mi.position = pos
          	add_child(mi)


          func _triangle(a: Vector3, b: Vector3, c: Vector3, col: Color) -> void:
          	var mesh := ArrayMesh.new()
          	var arrays := []
          	arrays.resize(Mesh.ARRAY_MAX)
          	arrays[Mesh.ARRAY_VERTEX] = PackedVector3Array([a, b, c])
          	arrays[Mesh.ARRAY_NORMAL] = PackedVector3Array([Vector3.UP, Vector3.UP, Vector3.UP])
          	mesh.add_surface_from_arrays(Mesh.PRIMITIVE_TRIANGLES, arrays)
          	var mi := MeshInstance3D.new()
          	mi.mesh = mesh
          	var m := _mat(col)
          	m.cull_mode = BaseMaterial3D.CULL_DISABLED
          	mi.material_override = m
          	add_child(mi)


          func _cell_world(g: Vector2i) -> Vector3:
          	return Vector3(g.x - 7.0, 0.0, g.y - 7.0)


          func _build_board() -> void:
          	# Mesa
          	_box(Vector3(18, 0.3, 21), Vector3(0, -0.25, 1.5), Color(0.55, 0.85, 0.5))

          	# Bases coloridas com 4 encaixes
          	for s in 4:
          		var c: Color = LudoPlayer.COLORS[s]
          		var bc: Vector2 = LudoPlayer.BASE_CENTERS[s]
          		var wp := Vector3(bc.x - 7.0, 0.0, bc.y - 7.0)
          		_box(Vector3(5, 0.12, 5), wp, c.lightened(0.15))
          		for i in 4:
          			var off: Vector2 = LudoPlayer.SLOT_OFFSETS[i] * 0.9
          			_disc(0.5, 0.04, wp + Vector3(off.x, 0.07, off.y), Color.WHITE)

          	# 52 casas da trilha
          	for idx in 52:
          		var g: Vector2i = LudoPlayer.TRACK[idx]
          		var col := Color(1.0, 0.98, 0.88)
          		var start_seat: int = LudoPlayer.START_INDEX.find(idx)
          		if start_seat >= 0:
          			col = LudoPlayer.COLORS[start_seat]
          		var wp := _cell_world(g)
          		_box(Vector3(0.92, 0.2, 0.92), wp, col)
          		if idx in LudoPlayer.SAFE_CELLS:
          			_disc(0.25, 0.04, wp + Vector3(0, 0.11, 0), Color(1.0, 0.8, 0.1))

          	# Reta final
          	for s in 4:
          		for g in LudoPlayer.HOME[s]:
          			_box(Vector3(0.92, 0.2, 0.92), _cell_world(g), (LudoPlayer.COLORS[s] as Color).lightened(0.1))

          	# Centro: 4 triângulos coloridos
          	var y := 0.11
          	var tl := Vector3(-1.5, y, -1.5)
          	var tr := Vector3(1.5, y, -1.5)
          	var bl := Vector3(-1.5, y, 1.5)
          	var br := Vector3(1.5, y, 1.5)
          	var mid := Vector3(0, y, 0)
          	_triangle(tl, bl, mid, LudoPlayer.COLORS[0])  # esquerda: vermelho
          	_triangle(tl, tr, mid, LudoPlayer.COLORS[1])  # topo: verde
          	_triangle(tr, br, mid, LudoPlayer.COLORS[2])  # direita: amarelo
          	_triangle(bl, br, mid, LudoPlayer.COLORS[3])  # baixo: azul


          # ---------------------------------------------------------------- interface

          func _style_button(b: Button, col: Color) -> void:
          	for st in ["normal", "hover", "pressed", "disabled"]:
          		var sb := StyleBoxFlat.new()
          		sb.bg_color = col if st != "pressed" else col.darkened(0.25)
          		if st == "disabled":
          			sb.bg_color = col.darkened(0.4)
          		sb.set_corner_radius_all(32)
          		sb.set_border_width_all(6)
          		sb.border_color = Color.WHITE
          		b.add_theme_stylebox_override(st, sb)
          	b.add_theme_color_override("font_color", Color.WHITE)
          	b.add_theme_color_override("font_outline_color", Color(0, 0, 0, 0.6))
          	b.add_theme_constant_override("outline_size", 8)


          func _make_button(text: String, min_size: Vector2, font_size: int, col: Color) -> Button:
          	var b := Button.new()
          	b.text = text
          	b.custom_minimum_size = min_size
          	b.add_theme_font_size_override("font_size", font_size)
          	_style_button(b, col)
          	return b


          func _make_label(text: String, font_size: int, col: Color = Color.WHITE) -> Label:
          	var l := Label.new()
          	l.text = text
          	l.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	l.add_theme_font_size_override("font_size", font_size)
          	l.add_theme_color_override("font_color", col)
          	l.add_theme_color_override("font_outline_color", Color(0, 0, 0, 0.85))
          	l.add_theme_constant_override("outline_size", 12)
          	return l


          func _build_ui() -> void:
          	var layer := CanvasLayer.new()
          	add_child(layer)
          	var root := Control.new()
          	root.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	root.mouse_filter = Control.MOUSE_FILTER_IGNORE
          	layer.add_child(root)

          	# Topo: vez do jogador + botão Menu
          	var top := HBoxContainer.new()
          	top.anchor_right = 1.0
          	top.offset_left = 20
          	top.offset_right = -20
          	top.offset_top = 30
          	top.add_theme_constant_override("separation", 12)
          	root.add_child(top)
          	turn_label = _make_label("", 48)
          	turn_label.size_flags_horizontal = Control.SIZE_EXPAND_FILL
          	top.add_child(turn_label)
          	var menu_btn := _make_button("Menu", Vector2(170, 90), 38, Color(0.35, 0.35, 0.5))
          	menu_btn.pressed.connect(_show_menu)
          	top.add_child(menu_btn)

          	msg_label = _make_label("", 40)
          	msg_label.anchor_right = 1.0
          	msg_label.offset_left = 20
          	msg_label.offset_right = -20
          	msg_label.offset_top = 140
          	msg_label.autowrap_mode = TextServer.AUTOWRAP_WORD_SMART
          	root.add_child(msg_label)

          	# Rodapé: botões de peão + rolar dado
          	var bottom := VBoxContainer.new()
          	bottom.anchor_left = 0.0
          	bottom.anchor_right = 1.0
          	bottom.anchor_top = 1.0
          	bottom.anchor_bottom = 1.0
          	bottom.offset_left = 20
          	bottom.offset_right = -20
          	bottom.offset_top = -40
          	bottom.offset_bottom = -40
          	bottom.grow_vertical = Control.GROW_DIRECTION_BEGIN
          	bottom.add_theme_constant_override("separation", 18)
          	root.add_child(bottom)

          	pick_box = HBoxContainer.new()
          	pick_box.alignment = BoxContainer.ALIGNMENT_CENTER
          	pick_box.add_theme_constant_override("separation", 14)
          	bottom.add_child(pick_box)
          	for i in 4:
          		var b := _make_button(str(i + 1), Vector2(160, 160), 70, Color(0.5, 0.5, 0.5))
          		b.pressed.connect(_on_pick_pressed.bind(i))
          		pick_box.add_child(b)
          		pick_buttons.append(b)
          	pick_box.hide()

          	roll_button = _make_button("ROLAR DADO", Vector2(0, 180), 68, Color(1.0, 0.55, 0.1))
          	roll_button.pressed.connect(_roll)
          	bottom.add_child(roll_button)

          	# Menu inicial
          	menu_panel = ColorRect.new()
          	(menu_panel as ColorRect).color = Color(0.1, 0.15, 0.4, 0.94)
          	menu_panel.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	root.add_child(menu_panel)
          	var center := CenterContainer.new()
          	center.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	menu_panel.add_child(center)
          	var vb := VBoxContainer.new()
          	vb.add_theme_constant_override("separation", 26)
          	center.add_child(vb)
          	vb.add_child(_make_label("LINDOSO 3D", 96, Color(1, 0.85, 0.2)))
          	vb.add_child(_make_label("Escolha o modo", 44))
          	var modes := [
          		["1 Jogador vs 3 Bots", 1, Color(0.9, 0.25, 0.25)],
          		["2 Jogadores", 2, Color(0.2, 0.7, 0.3)],
          		["3 Jogadores", 3, Color(0.95, 0.7, 0.1)],
          		["4 Jogadores", 4, Color(0.2, 0.45, 0.95)],
          	]
          	for m in modes:
          		var b := _make_button(m[0], Vector2(620, 150), 52, m[2])
          		b.pressed.connect(_start_game.bind(m[1]))
          		vb.add_child(b)

          	# Tela de vitória
          	win_panel = ColorRect.new()
          	(win_panel as ColorRect).color = Color(0, 0, 0, 0.75)
          	win_panel.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	root.add_child(win_panel)
          	var wc := CenterContainer.new()
          	wc.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	win_panel.add_child(wc)
          	var wv := VBoxContainer.new()
          	wv.add_theme_constant_override("separation", 40)
          	wc.add_child(wv)
          	win_label = _make_label("", 80)
          	wv.add_child(win_label)
          	var again := _make_button("Jogar de novo", Vector2(620, 160), 56, Color(0.2, 0.7, 0.3))
          	again.pressed.connect(_show_menu)
          	wv.add_child(again)
          	win_panel.hide()


          func _show_menu() -> void:
          	_game_id += 1
          	state = State.MENU
          	_clear_players()
          	pick_box.hide()
          	roll_button.hide()
          	turn_label.text = ""
          	msg_label.text = ""
          	win_panel.hide()
          	menu_panel.show()


          # ---------------------------------------------------------------- partida

          func _clear_players() -> void:
          	for p in players:
          		p.queue_free()
          	players.clear()


          func _start_game(humans: int) -> void:
          	_game_id += 1
          	_clear_players()
          	var seats: Array[int]
          	match humans:
          		2: seats = [0, 2]
          		3: seats = [0, 1, 2]
          		_: seats = [0, 1, 2, 3]
          	for n in seats.size():
          		var p := LudoPlayer.new()
          		add_child(p)
          		p.setup(seats[n], n >= humans)  # humanos primeiro, o resto são bots
          		players.append(p)
          	current = 0
          	menu_panel.hide()
          	win_panel.hide()
          	_begin_turn()


          func _begin_turn() -> void:
          	var gid := _game_id
          	var p := players[current]
          	state = State.WAIT_ROLL
          	dice.set_tint(p.color)
          	turn_label.text = "Vez: %s%s" % [LudoPlayer.NAMES[p.seat], " (Bot)" if p.is_bot else ""]
          	turn_label.add_theme_color_override("font_color", p.color.lightened(0.2))
          	pick_box.hide()
          	roll_button.visible = not p.is_bot
          	roll_button.disabled = false
          	if p.is_bot:
          		await get_tree().create_timer(0.8).timeout
          		if gid != _game_id:
          			return
          		_roll()


          func _roll() -> void:
          	if state != State.WAIT_ROLL:
          		return
          	state = State.BUSY
          	roll_button.disabled = true
          	var gid := _game_id
          	var p := players[current]
          	dice_value = await dice.roll()
          	if gid != _game_id:
          		return
          	msg_label.text = "%s tirou %d" % [LudoPlayer.NAMES[p.seat], dice_value]
          	movable = p.movable_pawns(dice_value)

          	if movable.is_empty():
          		msg_label.text += " - sem jogadas"
          		await get_tree().create_timer(1.0).timeout
          		if gid != _game_id:
          			return
          		_next_turn()
          	elif p.is_bot:
          		await get_tree().create_timer(0.5).timeout
          		if gid != _game_id:
          			return
          		_do_move(LudoBot.choose(p, dice_value, players))
          	elif movable.size() == 1:
          		await get_tree().create_timer(0.4).timeout
          		if gid != _game_id:
          			return
          		_do_move(movable[0])
          	else:
          		_show_pick(p)


          func _show_pick(p: LudoPlayer) -> void:
          	state = State.WAIT_PICK
          	roll_button.hide()
          	msg_label.text += "\nToque no peão ou no botão"
          	for i in 4:
          		var ok := i in movable
          		pick_buttons[i].visible = ok
          		if ok:
          			_style_button(pick_buttons[i], p.color.darkened(0.1))
          			p.set_highlight(i, true)
          	pick_box.show()


          func _on_pick_pressed(i: int) -> void:
          	if state == State.WAIT_PICK and i in movable:
          		_do_move(i)


          func _unhandled_input(event: InputEvent) -> void:
          	if state != State.WAIT_PICK:
          		return
          	var mb := event as InputEventMouseButton
          	if mb == null or not mb.pressed or mb.button_index != MOUSE_BUTTON_LEFT:
          		return
          	var p := players[current]
          	var best := -1
          	var best_d := 110.0
          	for i in movable:
          		var sp := camera.unproject_position(p.pawns[i].global_position + Vector3(0, 0.5, 0))
          		var d := sp.distance_to(mb.position)
          		if d < best_d:
          			best_d = d
          			best = i
          	if best >= 0:
          		_do_move(best)


          func _do_move(i: int) -> void:
          	state = State.BUSY
          	var gid := _game_id
          	var p := players[current]
          	p.clear_highlights()
          	pick_box.hide()
          	await p.move_pawn(i, dice_value)
          	if gid != _game_id:
          		return
          	await _resolve_capture(p, i)
          	if gid != _game_id:
          		return
          	if p.all_finished():
          		_win(p)
          		return
          	if dice_value == 6:
          		msg_label.text = "Tirou 6, joga de novo!"
          		_begin_turn()
          	else:
          		_next_turn()


          ## Comer: peões inimigos na mesma casa (que não seja segura) voltam à base.
          func _resolve_capture(p: LudoPlayer, i: int) -> void:
          	var cell := p.abs_index(i)
          	if cell < 0 or cell in LudoPlayer.SAFE_CELLS:
          		return
          	var hit := false
          	for other in players:
          		if other == p:
          			continue
          		for j in 4:
          			if other.abs_index(j) == cell:
          				hit = true
          				other.send_to_base(j)
          	if hit:
          		msg_label.text = "%s comeu um peão!" % LudoPlayer.NAMES[p.seat]
          		await get_tree().create_timer(0.7).timeout


          func _next_turn() -> void:
          	current = (current + 1) % players.size()
          	_begin_turn()


          func _win(p: LudoPlayer) -> void:
          	state = State.GAME_OVER
          	roll_button.hide()
          	win_label.text = "%s venceu!" % LudoPlayer.NAMES[p.seat]
          	win_label.add_theme_color_override("font_color", p.color.lightened(0.2))
          	win_panel.show()
          EOF_LINDOSO
          cat > scripts/player.gd << 'EOF_LINDOSO'
          class_name LudoPlayer
          extends Node3D
          ## Um jogador (cor) com 4 peões 3D e o movimento deles.
          ## rel: -1 = base | 0..50 = trilha (0 = casa de saída) | 51..55 = reta final | 56 = centro

          const BASE_REL = -1
          const FINISH_REL = 56
          const START_INDEX = [0, 13, 26, 39]
          const SAFE_CELLS = [0, 8, 13, 21, 26, 34, 39, 47]
          const NAMES = ["Vermelho", "Verde", "Amarelo", "Azul"]
          const COLORS = [
          	Color(0.93, 0.20, 0.20), Color(0.20, 0.78, 0.30),
          	Color(1.00, 0.84, 0.10), Color(0.20, 0.45, 1.00),
          ]
          const BASE_CENTERS = [Vector2(2.5, 2.5), Vector2(11.5, 2.5), Vector2(11.5, 11.5), Vector2(2.5, 11.5)]
          const SLOT_OFFSETS = [Vector2(-1, -1), Vector2(1, -1), Vector2(-1, 1), Vector2(1, 1)]
          const CENTER_DIRS = [Vector2(-1, 0), Vector2(0, -1), Vector2(1, 0), Vector2(0, 1)]

          # Reta final de cada cor (grade 15x15)
          const HOME = [
          	[Vector2i(1, 7), Vector2i(2, 7), Vector2i(3, 7), Vector2i(4, 7), Vector2i(5, 7)],
          	[Vector2i(7, 1), Vector2i(7, 2), Vector2i(7, 3), Vector2i(7, 4), Vector2i(7, 5)],
          	[Vector2i(13, 7), Vector2i(12, 7), Vector2i(11, 7), Vector2i(10, 7), Vector2i(9, 7)],
          	[Vector2i(7, 13), Vector2i(7, 12), Vector2i(7, 11), Vector2i(7, 10), Vector2i(7, 9)],
          ]

          # As 52 casas da trilha em cruz, no sentido horário
          const TRACK = [
          	Vector2i(1, 6), Vector2i(2, 6), Vector2i(3, 6), Vector2i(4, 6), Vector2i(5, 6),
          	Vector2i(6, 5), Vector2i(6, 4), Vector2i(6, 3), Vector2i(6, 2), Vector2i(6, 1), Vector2i(6, 0),
          	Vector2i(7, 0), Vector2i(8, 0),
          	Vector2i(8, 1), Vector2i(8, 2), Vector2i(8, 3), Vector2i(8, 4), Vector2i(8, 5),
          	Vector2i(9, 6), Vector2i(10, 6), Vector2i(11, 6), Vector2i(12, 6), Vector2i(13, 6), Vector2i(14, 6),
          	Vector2i(14, 7), Vector2i(14, 8),
          	Vector2i(13, 8), Vector2i(12, 8), Vector2i(11, 8), Vector2i(10, 8), Vector2i(9, 8),
          	Vector2i(8, 9), Vector2i(8, 10), Vector2i(8, 11), Vector2i(8, 12), Vector2i(8, 13), Vector2i(8, 14),
          	Vector2i(7, 14), Vector2i(6, 14),
          	Vector2i(6, 13), Vector2i(6, 12), Vector2i(6, 11), Vector2i(6, 10), Vector2i(6, 9),
          	Vector2i(5, 8), Vector2i(4, 8), Vector2i(3, 8), Vector2i(2, 8), Vector2i(1, 8), Vector2i(0, 8),
          	Vector2i(0, 7), Vector2i(0, 6),
          ]

          var seat := 0
          var is_bot := false
          var color := Color.WHITE
          var pawns: Array[Node3D] = []
          var rel: Array[int] = [-1, -1, -1, -1]
          var _materials: Array[StandardMaterial3D] = []
          var _labels: Array[Label3D] = []


          func setup(p_seat: int, p_is_bot: bool) -> void:
          	seat = p_seat
          	is_bot = p_is_bot
          	color = COLORS[seat]
          	for i in 4:
          		_make_pawn(i)
          		pawns[i].position = world_pos_for(i)


          func _make_pawn(i: int) -> void:
          	var root := Node3D.new()
          	var mat := StandardMaterial3D.new()
          	mat.albedo_color = color
          	mat.roughness = 0.35
          	mat.emission_enabled = true
          	mat.emission = color.lightened(0.4)
          	mat.emission_energy_multiplier = 0.0

          	var body := MeshInstance3D.new()
          	var cyl := CylinderMesh.new()
          	cyl.top_radius = 0.18
          	cyl.bottom_radius = 0.32
          	cyl.height = 0.5
          	body.mesh = cyl
          	body.material_override = mat
          	body.position.y = 0.25
          	root.add_child(body)

          	var head := MeshInstance3D.new()
          	var sph := SphereMesh.new()
          	sph.radius = 0.24
          	sph.height = 0.48
          	head.mesh = sph
          	head.material_override = mat
          	head.position.y = 0.66
          	root.add_child(head)

          	var lbl := Label3D.new()
          	lbl.text = str(i + 1)
          	lbl.font_size = 72
          	lbl.pixel_size = 0.009
          	lbl.billboard = BaseMaterial3D.BILLBOARD_ENABLED
          	lbl.no_depth_test = true
          	lbl.outline_size = 18
          	lbl.position = Vector3(0, 1.3, 0)
          	lbl.visible = false
          	root.add_child(lbl)

          	add_child(root)
          	pawns.append(root)
          	_materials.append(mat)
          	_labels.append(lbl)


          func abs_index(i: int) -> int:
          	var r: int = rel[i]
          	if r < 0 or r > 50:
          		return -1
          	var idx: int = (START_INDEX[seat] + r) % 52
          	return idx


          func world_pos_for(i: int) -> Vector3:
          	var r: int = rel[i]
          	var g := Vector2.ZERO
          	var y := 0.1
          	var jitter := Vector2((i % 2) - 0.5, floorf(i / 2.0) - 0.5) * 0.22
          	if r == BASE_REL:
          		g = BASE_CENTERS[seat] + SLOT_OFFSETS[i] * 0.9
          		y = 0.08
          	elif r <= 50:
          		var idx: int = (START_INDEX[seat] + r) % 52
          		g = Vector2(TRACK[idx]) + jitter
          	elif r < FINISH_REL:
          		g = Vector2(HOME[seat][r - 51]) + jitter
          	else:
          		var dir: Vector2 = CENTER_DIRS[seat]
          		var perp := Vector2(-dir.y, dir.x)
          		g = Vector2(7, 7) + dir * 0.7 + perp * (i - 1.5) * 0.28
          		y = 0.12
          	return Vector3(g.x - 7.0, y, g.y - 7.0)


          func can_move(i: int, d: int) -> bool:
          	var r: int = rel[i]
          	if r == FINISH_REL:
          		return false
          	if r == BASE_REL:
          		return d == 6
          	return r + d <= FINISH_REL


          func movable_pawns(d: int) -> Array[int]:
          	var out: Array[int] = []
          	for i in 4:
          		if can_move(i, d):
          			out.append(i)
          	return out


          func finished_count() -> int:
          	var n := 0
          	for r in rel:
          		if r == FINISH_REL:
          			n += 1
          	return n


          func all_finished() -> bool:
          	return finished_count() == 4


          func move_pawn(i: int, d: int) -> void:
          	if rel[i] == BASE_REL:
          		rel[i] = 0
          		await _hop_to(i, world_pos_for(i), 0.3)
          		return
          	for _s in d:
          		rel[i] += 1
          		await _hop_to(i, world_pos_for(i), 0.16)


          func send_to_base(i: int) -> void:
          	rel[i] = BASE_REL
          	await _hop_to(i, world_pos_for(i), 0.5)


          func set_highlight(i: int, on: bool) -> void:
          	_materials[i].emission_energy_multiplier = 0.9 if on else 0.0
          	pawns[i].scale = Vector3.ONE * (1.3 if on else 1.0)
          	_labels[i].visible = on


          func clear_highlights() -> void:
          	for i in 4:
          		set_highlight(i, false)


          func _hop_to(i: int, target: Vector3, dur: float) -> void:
          	var p := pawns[i]
          	var tw := create_tween()
          	tw.tween_method(_hop_step.bind(p, p.position, target), 0.0, 1.0, dur)
          	await tw.finished


          func _hop_step(t: float, p: Node3D, start: Vector3, target: Vector3) -> void:
          	var pos := start.lerp(target, t)
          	pos.y += sin(t * PI) * 0.5
          	p.position = pos
          EOF_LINDOSO

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona Lindoso 3D (Godot 4 / GDScript)" || echo "Nada para commitar"
          git push
